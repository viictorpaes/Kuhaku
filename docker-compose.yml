services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kuhaku
      POSTGRES_PASSWORD: kuhaku
      POSTGRES_DB: kuhaku
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuhaku -d kuhaku"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    # Caso precise de hot-reloading em desenvolvimento local, você pode descomentar a linha de volume abaixo
    # volumes:
    #   - .:/app
    command: >
      sh -c "npm run prisma:generate --workspace backend
      && npm run prisma:migrate:deploy --workspace backend
      && npm run prisma:seed --workspace backend
      && npm exec --workspace backend tsx --watch src/main.ts"
    env_file:
      - ./backend/.env
    environment:
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
    # Caso precise de hot-reloading em desenvolvimento local, você pode descomentar a linha de volume abaixo
    # volumes:
    #   - .:/app
    command: npm run dev --workspace frontend -- --host 0.0.0.0
    environment:
      # Atenção: Se o seu frontend acessa a API a partir do navegador, 'http://backend:3001' pode causar erro de DNS. 
      # Se for esse o caso, altere para http://localhost:3001. Se for SSR (Server-Side Rendering), mantenha http://backend:3001.
      VITE_API_URL: http://backend:3001 
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: